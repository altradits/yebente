services:
  - type: web
    name: yebente
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BITCOIN_CORE_RPC_URL
        sync: false
      - key: BITCOIN_CORE_RPC_USER
        sync: false
      - key: BITCOIN_CORE_RPC_PASSWORD
        sync: false
      - key: LND_REST_URL
        sync: false
      - key: LND_INVOICE_MACAROON
        sync: false
      - key: LND_PAY_MACAROON
        sync: false
      - key: YEBENTE_OWNER_BTC_KES
        sync: false
      - key: YEBENTE_OWNER_BTC_ETB
        sync: false
      - key: YEBENTE_OWNER_BTC_USD
        sync: false
